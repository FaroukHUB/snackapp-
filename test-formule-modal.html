<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test Modal Formule</title>
</head>
<body>
<h1>Test du Modal Formule</h1>
<button onclick="testFormuleModal()">Tester Modal Formule</button>
<div id="results"></div>

<script>
async function testFormuleModal() {
    const results = document.getElementById('results');
    results.innerHTML = '<h2>Diagnostic en cours...</h2>';

    try {
        // 1. Charger la config
        const response = await fetch('/snackup/frontend/api/menu.php');
        const data = await response.json();

        results.innerHTML += '<h3>✅ Config chargée</h3>';
        results.innerHTML += `<pre>${JSON.stringify(data, null, 2).substring(0, 500)}...</pre>`;

        // 2. Vérifier les formules
        const formules = data.formules || [];
        results.innerHTML += `<h3>Formules trouvées: ${formules.length}</h3>`;

        if (formules.length > 0) {
            const formule = formules[0];
            results.innerHTML += `<h4>Test avec formule: ${formule.name}</h4>`;
            results.innerHTML += `<pre>${JSON.stringify(formule, null, 2)}</pre>`;

            // 3. Tester getProductsByCategory pour chaque include
            if (formule.includes && formule.includes.length > 0) {
                results.innerHTML += '<h3>Test des includes:</h3>';

                formule.includes.forEach((include, index) => {
                    results.innerHTML += `<h4>Include ${index + 1}: ${include.label}</h4>`;
                    results.innerHTML += `<pre>Type: ${include.type}, CategoryID: ${include.categoryId}, ProductID: ${include.productId}</pre>`;

                    // Chercher les produits disponibles
                    let products = [];
                    if (include.type === 'category' && include.categoryId) {
                        const category = data.menu?.categories?.find(c => c.id === include.categoryId);
                        products = category?.items?.filter(p => p.status === 'available') || [];
                        results.innerHTML += `<p>Produits trouvés dans catégorie "${include.categoryId}": ${products.length}</p>`;
                        if (products.length > 0) {
                            results.innerHTML += `<ul>${products.map(p => `<li>${p.name} (${p.id})</li>`).join('')}</ul>`;
                        } else {
                            results.innerHTML += `<p style="color: red;">❌ Aucun produit trouvé! Catégories disponibles: ${data.menu?.categories?.map(c => c.id).join(', ')}</p>`;
                        }
                    } else if (include.type === 'product' && include.productId) {
                        // Chercher le produit spécifique
                        const allProducts = [];
                        data.menu?.categories?.forEach(cat => {
                            if (cat.items) {
                                allProducts.push(...cat.items);
                            }
                        });
                        const product = allProducts.find(p => p.id === include.productId && p.status === 'available');
                        if (product) {
                            products = [product];
                            results.innerHTML += `<p>✅ Produit trouvé: ${product.name}</p>`;
                        } else {
                            results.innerHTML += `<p style="color: red;">❌ Produit "${include.productId}" non trouvé!</p>`;
                        }
                    }
                });
            } else {
                results.innerHTML += '<p style="color: orange;">⚠️ Cette formule n\'a pas d\'includes</p>';
            }
        }

    } catch (error) {
        results.innerHTML += `<h3 style="color: red;">❌ Erreur:</h3><pre>${error.message}</pre>`;
    }
}
</script>
</body>
</html>
